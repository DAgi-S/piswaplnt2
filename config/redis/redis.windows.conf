# Redis configuration for Windows
port 6379
bind 127.0.0.1
protected-mode yes
requirepass your_redis_password_here

# Windows specific settings
dir C:/redis/data
logfile C:/redis/logs/redis.log
dbfilename dump.rdb

# Security settings
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"

# Performance tuning
tcp-keepalive 300
timeout 0
tcp-backlog 511
databases 16 