<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lebawi Net Trading PLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #0a0a1a;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            position: relative;
            max-width: 1200px;
            padding: 2rem;
            text-align: center;
            z-index: 1;
        }
        
        .title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #00fffc, #0050ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s ease-out forwards 0.5s;
        }
        
        .subtitle {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #a0a0ff;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s ease-out forwards 0.8s;
        }
        
        .contact {
            margin-top: 3rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s ease-out forwards 1.1s;
        }
        
        .contact p {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #dcdcff;
        }
        
        .phone {
            display: inline-block;
            margin: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 1.1rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .phone:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 80, 255, 0.2);
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(0, 80, 255, 0.8), rgba(0, 255, 252, 0));
            animation: float 15s infinite linear;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 30px) scale(0.9);
            }
            100% {
                transform: translate(0, 0) scale(1);
            }
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.5rem;
            }
        }
        
        /* Game styles */
        .game-container {
            position: relative;
            margin-top: 3rem;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s ease-out forwards 1.3s;
        }
        
        .game-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #a0a0ff;
        }
        
        .game-score {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #00fffc;
        }
        
        .game-button {
            padding: 0.8rem 1.5rem;
            background: rgba(0, 80, 255, 0.3);
            border: 1px solid rgba(0, 200, 255, 0.5);
            border-radius: 30px;
            color: #ffffff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            margin-top: 1rem;
        }
        
        .game-button:hover {
            background: rgba(0, 100, 255, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 80, 255, 0.3);
        }
        
        .star {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.1s ease;
            z-index: 10;
        }
        
        .star:hover {
            transform: scale(1.2);
        }
        
        .star svg {
            width: 30px;
            height: 30px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 0, 0.8));
        }
        
        .star-point {
            color: #FFD700;
            display: inline-block;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            margin-left: 0.5rem;
            vertical-align: middle;
        }
        
        @keyframes collectStar {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        /* Games tabs */
        .games-wrapper {
            position: relative;
            margin-top: 3rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1s ease-out forwards 1.3s;
        }
        
        .games-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
        }
        
        .tab {
            padding: 0.5rem 1.5rem;
            margin: 0 0.3rem;
            background: rgba(0, 80, 255, 0.2);
            border: 1px solid rgba(0, 200, 255, 0.3);
            border-radius: 20px;
            color: #a0a0ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tab.active {
            background: rgba(0, 80, 255, 0.4);
            color: #ffffff;
            border-color: rgba(0, 200, 255, 0.7);
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.3);
        }
        
        .tab:hover {
            background: rgba(0, 100, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .game-panel {
            display: none;
        }
        
        .game-panel.active {
            display: block;
        }
        
        /* Number Guess Game */
        .number-game-container {
            position: relative;
            height: 200px;
            border-radius: 10px;
            border: 1px solid rgba(0, 200, 255, 0.2);
            background: rgba(0, 50, 100, 0.1);
            margin: 20px 0;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .number-input-container {
            margin: 15px 0;
        }
        
        .number-input {
            background: rgba(0, 80, 255, 0.1);
            border: 1px solid rgba(0, 200, 255, 0.3);
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            width: 80px;
            text-align: center;
            font-size: 1.2rem;
            margin-right: 10px;
        }
        
        .number-input:focus {
            outline: none;
            border-color: rgba(0, 200, 255, 0.7);
            box-shadow: 0 0 10px rgba(0, 200, 255, 0.3);
        }
        
        .number-submit {
            padding: 0.5rem 1rem;
            background: rgba(0, 80, 255, 0.3);
            border: 1px solid rgba(0, 200, 255, 0.5);
            border-radius: 20px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .number-submit:hover {
            background: rgba(0, 100, 255, 0.5);
            transform: translateY(-2px);
        }
        
        .hint {
            color: #a0a0ff;
            font-size: 1.1rem;
            margin: 10px 0;
            min-height: 1.5rem;
        }
        
        .history {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 300px;
            margin-top: 10px;
        }
        
        .history-item {
            display: inline-block;
            width: 35px;
            height: 35px;
            line-height: 35px;
            text-align: center;
            margin: 3px;
            border-radius: 50%;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        .history-item.too-high {
            background: rgba(255, 100, 100, 0.3);
            border: 1px solid rgba(255, 100, 100, 0.6);
            color: #ffcccc;
        }
        
        .history-item.too-low {
            background: rgba(100, 100, 255, 0.3);
            border: 1px solid rgba(100, 100, 255, 0.6);
            color: #ccccff;
        }
        
        .history-item.correct {
            background: rgba(100, 255, 100, 0.3);
            border: 1px solid rgba(100, 255, 100, 0.6);
            color: #ccffcc;
            box-shadow: 0 0 15px rgba(100, 255, 100, 0.5);
        }
        
        .attempts-display {
            font-size: 1rem;
            color: #00fffc;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <h1 class="title">Nati Automotives Web Site <br> Under Development</h1>
        <h2 class="subtitle">By Lebawi Net Trading PLC</h2>
        
        <div class="games-wrapper">
            <div class="games-tabs">
                <div class="tab active" data-game="star-game">Star Collector</div>
                <div class="tab" data-game="number-game">Number Guess</div>
            </div>
            
            <div class="game-panel active" id="star-game">
                <div class="game-score">Score: <span id="score">0</span><span class="star-point">★</span></div>
                <div id="game-area" style="height: 200px; position: relative; overflow: hidden; border-radius: 10px; border: 1px solid rgba(0, 200, 255, 0.2); background: rgba(0, 50, 100, 0.1); margin: 20px 0;"></div>
                <button class="game-button" id="start-game">Start Game</button>
            </div>
            
            <div class="game-panel" id="number-game">
                <div class="number-game-container">
                    <p>Guess a number between 1-100</p>
                    <div class="hint" id="hint-text">Start by making your first guess!</div>
                    <div class="number-input-container">
                        <input type="number" min="1" max="100" class="number-input" id="number-guess" placeholder="#">
                        <button class="number-submit" id="guess-btn">Guess</button>
                    </div>
                    <div class="history" id="guess-history"></div>
                    <div class="attempts-display">Attempts: <span id="attempts">0</span></div>
                    <button class="game-button" id="reset-number-game" style="margin-top: 10px;">New Game</button>
                </div>
            </div>
        </div>
        
        <div class="contact">
            <p>Please for more information contact us</p>
            <div class="phone">+251 924 067 895</div>
            <div class="phone">+251 901 000 251</div>
        </div>
    </div>

    <script>
        // Create animated background particles
        const particlesContainer = document.getElementById('particles');
        const colors = ['rgba(0, 80, 255, 0.3)', 'rgba(0, 200, 255, 0.3)', 'rgba(0, 255, 252, 0.3)'];
        
        for (let i = 0; i < 20; i++) {
            const circle = document.createElement('div');
            circle.classList.add('circle');
            
            // Random properties
            const size = Math.random() * 300 + 50;
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            const delay = Math.random() * 5;
            const duration = Math.random() * 10 + 10;
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            // Apply styles
            circle.style.width = `${size}px`;
            circle.style.height = `${size}px`;
            circle.style.left = `${posX}%`;
            circle.style.top = `${posY}%`;
            circle.style.background = color;
            circle.style.opacity = Math.random() * 0.3 + 0.1;
            circle.style.animationDuration = `${duration}s`;
            circle.style.animationDelay = `${delay}s`;
            
            particlesContainer.appendChild(circle);
        }
        
        // Interactive mouse movement effect
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            // Subtle parallax effect
            document.querySelectorAll('.circle').forEach(circle => {
                const factor = parseFloat(circle.style.opacity) * 20;
                const moveX = (mouseX - 0.5) * factor;
                const moveY = (mouseY - 0.5) * factor;
                circle.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
            
            // Title glow effect
            const title = document.querySelector('.title');
            const distance = Math.sqrt(Math.pow(mouseX - 0.5, 2) + Math.pow(mouseY - 0.5, 2));
            title.style.textShadow = `0 0 ${10 + distance * 40}px rgba(0, 200, 255, 0.8)`;
        });
        
        // Add subtle animation to contact elements
        const phoneElements = document.querySelectorAll('.phone');
        phoneElements.forEach(phone => {
            phone.addEventListener('mouseover', () => {
                document.querySelectorAll('.circle').forEach(circle => {
                    circle.style.animationDuration = '5s';
                });
            });
            
            phone.addEventListener('mouseout', () => {
                document.querySelectorAll('.circle').forEach(circle => {
                    const originalDuration = Math.random() * 10 + 10;
                    circle.style.animationDuration = `${originalDuration}s`;
                });
            });
        });
        
        // Game tabs
        const tabs = document.querySelectorAll('.tab');
        const gamePanels = document.querySelectorAll('.game-panel');
        
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetGame = tab.getAttribute('data-game');
                
                // Update active tab
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // Show target game panel
                gamePanels.forEach(panel => {
                    panel.classList.remove('active');
                    if (panel.id === targetGame) {
                        panel.classList.add('active');
                    }
                });
            });
        });
        
        // Simple Star Collection Game
        const gameArea = document.getElementById('game-area');
        const startButton = document.getElementById('start-game');
        const scoreElement = document.getElementById('score');
        let score = 0;
        let gameInterval;
        let activeStars = [];
        let isGameRunning = false;
        
        function createStar() {
            if (!isGameRunning) return;
            
            const star = document.createElement('div');
            star.classList.add('star');
            
            // Random position within game area
            const gameWidth = gameArea.clientWidth;
            const gameHeight = gameArea.clientHeight;
            const posX = Math.random() * (gameWidth - 30);
            const posY = Math.random() * (gameHeight - 30);
            
            star.style.left = `${posX}px`;
            star.style.top = `${posY}px`;
            
            // Star SVG
            star.innerHTML = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" 
                fill="#FFD700" stroke="#FFC700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>`;
            
            // Make star clickable
            star.addEventListener('click', () => collectStar(star));
            
            // Add to game area and track
            gameArea.appendChild(star);
            activeStars.push(star);
            
            // Auto-remove star after random time (3-6 seconds)
            setTimeout(() => {
                if (star.parentNode === gameArea) {
                    gameArea.removeChild(star);
                    activeStars = activeStars.filter(s => s !== star);
                }
            }, Math.random() * 3000 + 3000);
        }
        
        function collectStar(star) {
            score++;
            scoreElement.textContent = score;
            
            // Animation effect
            star.style.animation = 'collectStar 0.3s forwards';
            
            // Create sparkle effect
            const sparkle = document.createElement('div');
            sparkle.style.position = 'absolute';
            sparkle.style.left = star.style.left;
            sparkle.style.top = star.style.top;
            sparkle.style.fontSize = '2rem';
            sparkle.style.color = '#FFD700';
            sparkle.style.textShadow = '0 0 15px rgba(255, 215, 0, 0.9)';
            sparkle.style.transition = 'all 0.5s ease';
            sparkle.style.zIndex = '20';
            sparkle.textContent = '+1';
            
            gameArea.appendChild(sparkle);
            
            // Animate sparkle
            setTimeout(() => {
                sparkle.style.transform = 'translateY(-30px)';
                sparkle.style.opacity = '0';
            }, 10);
            
            // Remove sparkle after animation
            setTimeout(() => {
                if (sparkle.parentNode === gameArea) {
                    gameArea.removeChild(sparkle);
                }
            }, 600);
            
            // Remove star from activeStars and from DOM
            setTimeout(() => {
                if (star.parentNode === gameArea) {
                    gameArea.removeChild(star);
                    activeStars = activeStars.filter(s => s !== star);
                }
            }, 300);
        }
        
        function startGame() {
            if (isGameRunning) return;
            
            isGameRunning = true;
            score = 0;
            scoreElement.textContent = score;
            startButton.textContent = 'Reset Game';
            
            // Clean up existing stars
            activeStars.forEach(star => {
                if (star.parentNode === gameArea) {
                    gameArea.removeChild(star);
                }
            });
            activeStars = [];
            
            // Create stars at random intervals
            gameInterval = setInterval(() => {
                if (activeStars.length < 5) {
                    createStar();
                }
            }, 1000);
        }
        
        function resetGame() {
            isGameRunning = false;
            clearInterval(gameInterval);
            
            // Clean up existing stars
            activeStars.forEach(star => {
                if (star.parentNode === gameArea) {
                    gameArea.removeChild(star);
                }
            });
            activeStars = [];
            
            startButton.textContent = 'Start Game';
        }
        
        startButton.addEventListener('click', () => {
            if (isGameRunning) {
                resetGame();
            } else {
                startGame();
            }
        });
        
        // Number Guessing Game
        const numberInput = document.getElementById('number-guess');
        const guessBtn = document.getElementById('guess-btn');
        const hintText = document.getElementById('hint-text');
        const guessHistory = document.getElementById('guess-history');
        const attemptsElement = document.getElementById('attempts');
        const resetNumberGameBtn = document.getElementById('reset-number-game');
        
        let secretNumber;
        let attempts = 0;
        let isNumberGameActive = false;
        
        function startNumberGame() {
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            attemptsElement.textContent = attempts;
            guessHistory.innerHTML = '';
            hintText.textContent = 'Start by making your first guess!';
            numberInput.value = '';
            numberInput.disabled = false;
            guessBtn.disabled = false;
            isNumberGameActive = true;
        }
        
        function makeGuess() {
            if (!isNumberGameActive) return;
            
            const guess = parseInt(numberInput.value);
            
            // Validate input
            if (isNaN(guess) || guess < 1 || guess > 100) {
                hintText.textContent = 'Please enter a valid number between 1-100';
                return;
            }
            
            // Increment attempts
            attempts++;
            attemptsElement.textContent = attempts;
            
            // Create history item
            const historyItem = document.createElement('div');
            historyItem.textContent = guess;
            historyItem.classList.add('history-item');
            
            // Check guess
            if (guess === secretNumber) {
                hintText.textContent = `Correct! You found ${secretNumber} in ${attempts} tries.`;
                historyItem.classList.add('correct');
                numberInput.disabled = true;
                guessBtn.disabled = true;
                isNumberGameActive = false;
                
                // Celebration effect
                createCelebrationEffect();
            } else if (guess < secretNumber) {
                hintText.textContent = 'Too low! Try a higher number.';
                historyItem.classList.add('too-low');
            } else {
                hintText.textContent = 'Too high! Try a lower number.';
                historyItem.classList.add('too-high');
            }
            
            // Add to history
            guessHistory.appendChild(historyItem);
            
            // Clear input
            numberInput.value = '';
            numberInput.focus();
        }
        
        function createCelebrationEffect() {
            // Create multiple particles for celebration
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = '8px';
                particle.style.height = '8px';
                particle.style.borderRadius = '50%';
                particle.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
                particle.style.top = '50%';
                particle.style.left = '50%';
                particle.style.transform = 'translate(-50%, -50%)';
                particle.style.zIndex = '20';
                
                const container = document.querySelector('.number-game-container');
                container.appendChild(particle);
                
                // Random animation
                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 100;
                const duration = 1 + Math.random();
                
                particle.animate([
                    { transform: 'translate(-50%, -50%)', opacity: 1 },
                    { 
                        transform: `translate(calc(-50% + ${Math.cos(angle) * distance}px), calc(-50% + ${Math.sin(angle) * distance}px))`,
                        opacity: 0
                    }
                ], {
                    duration: duration * 1000,
                    easing: 'cubic-bezier(0, 0.9, 0.57, 1)'
                });
                
                // Remove particle after animation
                setTimeout(() => {
                    if (particle.parentNode === container) {
                        container.removeChild(particle);
                    }
                }, duration * 1000);
            }
        }
        
        // Event listeners for number game
        guessBtn.addEventListener('click', makeGuess);
        
        numberInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                makeGuess();
            }
        });
        
        resetNumberGameBtn.addEventListener('click', startNumberGame);
        
        // Initialize both games
        startNumberGame();
    </script>
</body>
</html>
